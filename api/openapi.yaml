openapi: 3.1.0
info:
  title: Personal Finance API
  version: 1.0.0
  description: The versioned HTTP API for Personal Finance Hub.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: signIn
      summary: Sign in with an email address and password
      description: Issues a bearer session token for valid credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: An authenticated session was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The supplied credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request did not contain valid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/signup:
    post:
      operationId: signUp
      summary: Sign up a new user account and provision a private workspace
      description: Registers a new user account and automatically provisions their primary private workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account registered and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The email address is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Retrieve authenticated current-user identity
      description: Returns the user identity of the caller authenticated via Bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/health:
    get:
      operationId: getHealth
      summary: Check service health
      description: Returns the service health without requiring authentication.
      responses:
        '200':
          description: The service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    SignUpRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        workspace_name:
          type: string
    SignInSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - access_token
            - token_type
          properties:
            access_token:
              type: string
            token_type:
              type: string
              const: Bearer
        message:
          type: string
    CurrentUserSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
    UserResponse:
      type: object
      required:
        - id
        - email
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
    HealthSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/HealthResponse'
        message:
          type: string
          description: The standard response message, empty for this endpoint.
    HealthResponse:
      type: object
      required:
        - status
        - app
      properties:
        status:
          type: string
          const: ok
          description: The service health status.
        app:
          type: string
          description: The configured application name.
