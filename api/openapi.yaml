openapi: 3.1.0
info:
  title: Personal Finance API
  version: 1.0.0
  description: The versioned HTTP API for Personal Finance Hub.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: signIn
      summary: Sign in with an email address and password
      description: Issues a bearer session token for valid credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: An authenticated session was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The supplied credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request did not contain valid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/signup:
    post:
      operationId: signUp
      summary: Sign up a new user account and provision a private workspace
      description: Registers a new user account and automatically provisions their primary private workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account registered and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The email address is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Retrieve authenticated current-user identity
      description: Returns the user identity of the caller authenticated via Bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me/preferences:
    get:
      operationId: getUserPreferences
      summary: Retrieve authenticated user preferences
      description: Returns current user preference configuration including base currency.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUserPreferences
      summary: Update authenticated user preferences
      description: Updates user preferences such as base currency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: The updated user preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid preference field or unsupported currency code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchUserPreferences
      summary: Patch authenticated user preferences
      description: Patches user preferences such as base currency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: The updated user preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid preference field or unsupported currency code.
  /v1/categories:
    get:
      operationId: listCategories
      summary: List user categories
      description: Retrieves all categories belonging strictly to the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of categories belonging to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCategory
      summary: Create a category
      description: Creates a new category belonging strictly to the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (e.g. invalid type or empty name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/categories/{id}:
    put:
      operationId: updateCategory
      summary: Update a category
      description: Updates mutable details of a category belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchCategory
      summary: Patch a category
      description: Patches mutable details of a category belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deactivateCategory
      summary: Deactivate a category
      description: Deactivates a category belonging to the authenticated user without erasing the record.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List user accounts
      description: Returns all accounts belonging to the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of the authenticated user's accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAccount
      summary: Create a new account
      description: Creates a new account belonging to the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (e.g. invalid type or unsupported currency code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts/{id}:
    put:
      operationId: updateAccount
      summary: Update an account
      description: Updates mutable details of an account belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchAccount
      summary: Patch an account
      description: Patches mutable details of an account belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deactivateAccount
      summary: Deactivate an account
      description: Deactivates an account belonging to the authenticated user without erasing the record.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/financial-records:
    post:
      operationId: createFinancialRecord
      summary: Create an income or expense financial record
      description: Creates an active record for the authenticated user. The Account and Category must be active, owned by the caller, and match the record kind and currency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFinancialRecordRequest'
      responses:
        '201':
          description: Financial record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecordSuccessResponse'
        '400': { description: The request body is malformed. }
        '401': { description: Unauthenticated or invalid token. }
        '403': { description: A referenced account or category belongs to another user. }
        '404': { description: A referenced account or category was not found. }
        '422': { description: Validation failed, including inactive or kind-mismatched references and invalid amounts, dates, or currencies. }
    get:
      operationId: listFinancialRecords
      summary: List the authenticated user's financial record history
      description: Returns active records newest-first by default. Set include_archived to true to include archived records.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FinancialRecordStartDate'
        - $ref: '#/components/parameters/FinancialRecordEndDate'
        - $ref: '#/components/parameters/FinancialRecordKind'
        - $ref: '#/components/parameters/FinancialRecordAccountID'
        - $ref: '#/components/parameters/FinancialRecordCategoryID'
        - $ref: '#/components/parameters/FinancialRecordIncludeArchived'
      responses:
        '200':
          description: Financial record history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecordListSuccessResponse'
        '400': { description: A query parameter is malformed. }
        '401': { description: Unauthenticated or invalid token. }
        '422': { description: The filter combination is invalid. }
  /v1/financial-records/{id}:
    get:
      operationId: getFinancialRecord
      summary: Retrieve one financial record
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Financial record found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecordSuccessResponse'
        '401': { description: Unauthenticated or invalid token. }
        '403': { description: The record belongs to another user. }
        '404': { description: Financial record not found. }
    put:
      operationId: updateFinancialRecord
      summary: Update an active financial record
      description: Updates supplied business fields after validating the resulting Account, Category, kind, amount, currency, and date. Archived records cannot be updated.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancialRecordRequest'
      responses:
        '200':
          description: Financial record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecordSuccessResponse'
        '400': { description: The request body is malformed. }
        '401': { description: Unauthenticated or invalid token. }
        '403': { description: The record or a referenced resource belongs to another user. }
        '404': { description: The record or a referenced resource was not found. }
        '422': { description: Validation failed or the record is archived. }
    patch:
      operationId: patchFinancialRecord
      summary: Update an active financial record
      description: Same partial-update behavior as PUT. Archived records cannot be updated.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFinancialRecordRequest'
      responses:
        '200':
          description: Financial record updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecordSuccessResponse'
        '400': { description: The request body is malformed. }
        '401': { description: Unauthenticated or invalid token. }
        '403': { description: The record or a referenced resource belongs to another user. }
        '404': { description: The record or a referenced resource was not found. }
        '422': { description: Validation failed or the record is archived. }
    delete:
      operationId: archiveFinancialRecord
      summary: Archive a financial record
      description: Sets is_active to false without hard-deleting the owned record. Archived records remain retrievable and are included in history only when include_archived is true.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Financial record archived successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialRecordSuccessResponse'
        '401': { description: Unauthenticated or invalid token. }
        '403': { description: The record belongs to another user. }
        '404': { description: Financial record not found. }
        '422': { description: The record is already archived. }
  /v1/health:

    get:
      operationId: getHealth
      summary: Check service health
      description: Returns the service health without requiring authentication.
      responses:
        '200':
          description: The service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FinancialRecordStartDate:
      name: start_date
      in: query
      schema: { type: string, format: date }
    FinancialRecordEndDate:
      name: end_date
      in: query
      schema: { type: string, format: date }
    FinancialRecordKind:
      name: kind
      in: query
      schema: { type: string, enum: [income, expense] }
    FinancialRecordAccountID:
      name: account_id
      in: query
      schema: { type: string, format: uuid }
    FinancialRecordCategoryID:
      name: category_id
      in: query
      schema: { type: string, format: uuid }
    FinancialRecordIncludeArchived:
      name: include_archived
      in: query
      schema: { type: boolean, default: false }
  schemas:
    CreateFinancialRecordRequest:
      type: object
      required: [kind, account_id, category_id, amount_minor, currency, date]
      properties:
        kind: { type: string, enum: [income, expense] }
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64, minimum: 1, description: Positive amount in the Account currency's minor units. }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Must equal the referenced Account currency. }
        date: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    UpdateFinancialRecordRequest:
      type: object
      description: Any supplied fields replace their current values; the resulting record must still have active, owned, kind-matched references and the Account currency.
      properties:
        kind: { type: string, enum: [income, expense] }
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        date: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    FinancialRecordResponse:
      type: object
      required: [id, user_id, kind, account_id, category_id, amount_minor, currency, date, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        kind: { type: string, enum: [income, expense] }
        account_id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, example: USD }
        date: { type: string, format: date-time }
        note: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FinancialRecordSuccessResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/FinancialRecordResponse' }
        message: { type: string }
    FinancialRecordListSuccessResponse:
      type: object
      required: [success, data, message]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/FinancialRecordResponse' }
        message: { type: string }
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    SignUpRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        workspace_name:
          type: string
    SignInSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - access_token
            - token_type
          properties:
            access_token:
              type: string
            token_type:
              type: string
              const: Bearer
        message:
          type: string
    CurrentUserSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
    UserResponse:
      type: object
      required:
        - id
        - email
        - base_currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        base_currency:
          type: string
          example: USD
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
