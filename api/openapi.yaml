openapi: 3.1.0
info:
  title: Personal Finance API
  version: 1.0.0
  description: The versioned HTTP API for Personal Finance Hub.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/login:
    post:
      operationId: signIn
      summary: Sign in with an email address and password
      description: Issues a bearer session token for valid credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: An authenticated session was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The supplied credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request did not contain valid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/signup:
    post:
      operationId: signUp
      summary: Sign up a new user account and provision a private workspace
      description: Registers a new user account and automatically provisions their primary private workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: User account registered and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The email address is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request contains invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Retrieve authenticated current-user identity
      description: Returns the user identity of the caller authenticated via Bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me/preferences:
    get:
      operationId: getUserPreferences
      summary: Retrieve authenticated user preferences
      description: Returns current user preference configuration including base currency.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateUserPreferences
      summary: Update authenticated user preferences
      description: Updates user preferences such as base currency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: The updated user preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid preference field or unsupported currency code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchUserPreferences
      summary: Patch authenticated user preferences
      description: Patches user preferences such as base currency.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: The updated user preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid preference field or unsupported currency code.
  /v1/categories:
    get:
      operationId: listCategories
      summary: List user categories
      description: Retrieves all categories belonging strictly to the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of categories belonging to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCategory
      summary: Create a category
      description: Creates a new category belonging strictly to the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (e.g. invalid type or empty name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/categories/{id}:
    put:
      operationId: updateCategory
      summary: Update a category
      description: Updates mutable details of a category belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchCategory
      summary: Patch a category
      description: Patches mutable details of a category belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deactivateCategory
      summary: Deactivate a category
      description: Deactivates a category belonging to the authenticated user without erasing the record.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the category).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List user accounts
      description: Returns all accounts belonging to the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of the authenticated user's accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createAccount
      summary: Create a new account
      description: Creates a new account belonging to the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (e.g. invalid type or unsupported currency code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/accounts/{id}:
    put:
      operationId: updateAccount
      summary: Update an account
      description: Updates mutable details of an account belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: patchAccount
      summary: Patch an account
      description: Patches mutable details of an account belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '400':
          description: The request body is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deactivateAccount
      summary: Deactivate an account
      description: Deactivates an account belonging to the authenticated user without erasing the record.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSuccessResponse'
        '401':
          description: Unauthenticated or invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (caller does not own the account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/health:

    get:
      operationId: getHealth
      summary: Check service health
      description: Returns the service health without requiring authentication.
      responses:
        '200':
          description: The service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSuccessResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
    SignUpRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true
        workspace_name:
          type: string
    SignInSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - access_token
            - token_type
          properties:
            access_token:
              type: string
            token_type:
              type: string
              const: Bearer
        message:
          type: string
    CurrentUserSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
    UserResponse:
      type: object
      required:
        - id
        - email
        - base_currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        base_currency:
          type: string
          example: USD
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdatePreferencesRequest:
      type: object
      required:
        - base_currency
      properties:
        base_currency:
          type: string
          example: EUR
          description: Standard 3-letter ISO 4217 currency code.
    UserPreferencesSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required:
            - base_currency
          properties:
            base_currency:
              type: string
              example: USD
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true
          description: Optional field validation error details.
    HealthSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/HealthResponse'
        message:
          type: string
          description: The standard response message, empty for this endpoint.
    HealthResponse:
      type: object
      required:
        - status
        - app
      properties:
        status:
          type: string
          const: ok
          description: The service health status.
        app:
          type: string
          description: The configured application name.
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
        - currency
      properties:
        name:
          type: string
          example: Checking Account
        type:
          type: string
          example: checking
          enum: [checking, savings, credit_card, investment, cash, loan, other]
        currency:
          type: string
          example: USD
          description: Standard 3-letter ISO 4217 currency code.
        description:
          type: string
          example: Primary daily checking account
        is_active:
          type: boolean
          default: true
    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Checking Account
        type:
          type: string
          example: savings
          enum: [checking, savings, credit_card, investment, cash, loan, other]
        currency:
          type: string
          example: USD
          description: Standard 3-letter ISO 4217 currency code.
        description:
          type: string
          example: Updated account description
        is_active:
          type: boolean

    AccountResponse:
      type: object
      required:
        - id
        - user_id
        - name
        - type
        - currency
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: Checking Account
        type:
          type: string
          example: checking
          enum: [checking, savings, credit_card, investment, cash, loan, other]
        currency:
          type: string
          example: USD
        description:
          type: string
          example: Primary daily checking account
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/AccountResponse'
        message:
          type: string
    AccountListSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'
        message:
          type: string
    CreateCategoryRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          example: Salary
        type:
          type: string
          example: income
          enum: [income, expense]
        is_active:
          type: boolean
          default: true
    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          example: Updated Category
        type:
          type: string
          example: expense
          enum: [income, expense]
        is_active:
          type: boolean
    CategoryResponse:
      type: object
      required:
        - id
        - user_id
        - name
        - type
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: Salary
        type:
          type: string
          example: income
          enum: [income, expense]
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategorySuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/CategoryResponse'
        message:
          type: string
    CategoryListSuccessResponse:
      type: object
      required:
        - success
        - data
        - message
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResponse'
        message:
          type: string

